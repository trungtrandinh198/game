name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12.18.0"

jobs:
  # ─── Quality gates ───────────────────────────────────────────────
  quality:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Content validate
        run: pnpm content:validate

  # ─── Security scan ───────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build & Push images ─────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [quality, security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: realtime
            dockerfile: apps/realtime/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Docker setup
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Deploy Staging (automatic) ──────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          echo "$STAGING_SSH_KEY" > /tmp/key && chmod 600 /tmp/key
          ssh -i /tmp/key -o StrictHostKeyChecking=no ${STAGING_USER}@${STAGING_HOST} <<'EOF'
            cd /opt/dnw
            git pull origin main
            docker compose -f infra/docker/compose.prod.yml pull
            docker compose -f infra/docker/compose.prod.yml up -d
            # Run migrations
            docker compose -f infra/docker/compose.prod.yml exec -T api npx tsx packages/db/src/cli/migrate.ts
            # Health check
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/readyz > /dev/null 2>&1; then
                echo "Staging is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Staging health check failed"
            exit 1
          EOF

  # ─── Deploy Production (manual approval) ─────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          echo "$PROD_SSH_KEY" > /tmp/key && chmod 600 /tmp/key
          ssh -i /tmp/key -o StrictHostKeyChecking=no ${PROD_USER}@${PROD_HOST} <<'EOF'
            cd /opt/dnw
            git pull origin main
            docker compose -f infra/docker/compose.prod.yml pull
            # Backup before deploy
            docker compose -f infra/docker/compose.prod.yml exec -T postgres pg_dump -U dnw dnw > /backups/dnw_$(date +%Y%m%d_%H%M%S).sql
            # Migrate then restart
            docker compose -f infra/docker/compose.prod.yml exec -T api npx tsx packages/db/src/cli/migrate.ts
            docker compose -f infra/docker/compose.prod.yml up -d
            # Health check
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/readyz > /dev/null 2>&1; then
                echo "Production is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Production health check failed — rolling back"
            docker compose -f infra/docker/compose.prod.yml down
            exit 1
          EOF
